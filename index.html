function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function getFallbackReply(recent) {
  const available = FALLBACK_POOL.filter(r => !recent.includes(r));
  const pool = available.length > 0 ? available : [...FALLBACK_POOL];
  return pool[Math.floor(Math.random() * pool.length)];
}

function generateReply(message) {
  const sys = [
    "You are the voice of the person who never received this message.",
    "Someone is writing something they never got to say — to an ex, a lost friend, a parent, someone who is gone.",
    "Write what that person would honestly say back, if they could.",
    "Respond in exactly one sentence. Maximum 20 words.",
    "Write like a real person. Not poetic. Not therapeutic. Not a chatbot.",
    "Vary the emotional register: sometimes regretful, sometimes matter-of-fact, sometimes quietly honest, sometimes unexpectedly direct.",
    "Do not start the reply with: I knew, I think, I understand, or I feel.",
    "Do not use the word closure. Do not ask a question. Just respond.",
    "Return only the sentence. No quotes, no punctuation outside the sentence, no extra text."
  ].join(" ");
  return fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 80,
      system: sys,
      messages: [{ role: "user", content: message }],
    }),
  })
    .then(r => r.json())
    .then(d => {
      if (d.content && d.content[0] && d.content[0].text) {
        return d.content[0].text.trim().replace(/^["']|["']$/g, "");
      }
      throw new Error("empty");
    });
}

/* ── BG CANVAS ── */
function useBgCanvas(ref) {
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    let W = 0, H = 0, stars = [], nebulas = [], comets = [], raf, cometTimer;
    function resize() {
      W = c.width = window.innerWidth; H = c.height = window.innerHeight;
      stars = []; nebulas = [];
      const n = Math.floor(W * H / 1800);
      for (let i = 0; i < n; i++) {
        const w = Math.random();
        stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.3+0.1,
          alpha: Math.random()*0.55+0.08, phase: Math.random()*Math.PI*2, ps: Math.random()*0.005+0.002,
          h: w<0.33 ? 315+Math.random()*25 : w<0.66 ? 255+Math.random()*35 : 38+Math.random()*18,
          s: 35+Math.random()*35, l: 65+Math.random()*28 });
      }
      [{ x:.12,y:.22,r:.22,h:295,a:.05 },{ x:.84,y:.15,r:.18,h:258,a:.044 },
       { x:.5,y:.8,r:.25,h:325,a:.04 },{ x:.08,y:.72,r:.15,h:205,a:.034 },
       { x:.88,y:.6,r:.16,h:275,a:.038 }].forEach(p => nebulas.push({
        x:W*p.x, y:H*p.y, r:Math.min(W,H)*p.r, h:p.h, baseA:p.a,
        phase:Math.random()*Math.PI*2, ps:Math.random()*0.003+0.001 }));
    }
    function spawnComet() {
      const h = Math.random()<0.5 ? 315+Math.random()*25 : 255+Math.random()*35;
      comets.push({ x:Math.random()*W*0.75, y:Math.random()*H*0.45,
        len:90+Math.random()*130, spd:3+Math.random()*4, alpha:0.6+Math.random()*0.2,
        angle:Math.PI/5+(Math.random()-0.5)*0.3, h });
    }
    function draw() {
      ctx.clearRect(0,0,W,H);
      nebulas.forEach(nb => {
        nb.phase += nb.ps;
        const a = nb.baseA*(0.7+0.3*Math.sin(nb.phase));
        const g = ctx.createRadialGradient(nb.x,nb.y,0,nb.x,nb.y,nb.r);
        g.addColorStop(0,`hsla(${nb.h},55%,50%,${a})`);
        g.addColorStop(0.5,`hsla(${nb.h+18},45%,36%,${a*0.35})`);
        g.addColorStop(1,"rgba(3,1,12,0)");
        ctx.beginPath(); ctx.arc(nb.x,nb.y,nb.r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      });
      stars.forEach(st => {
        st.phase += st.ps;
        const sa = st.alpha*(0.45+0.55*Math.sin(st.phase));
        ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2);
        ctx.fillStyle=`hsla(${st.h},${st.s}%,${st.l}%,${sa})`; ctx.fill();
      });
      for (let i=comets.length-1;i>=0;i--) {
        const cm=comets[i];
        cm.x+=Math.cos(cm.angle)*cm.spd; cm.y+=Math.sin(cm.angle)*cm.spd; cm.alpha-=0.012;
        if (cm.alpha<=0){comets.splice(i,1);continue;}
        const cg=ctx.createLinearGradient(cm.x,cm.y,cm.x-Math.cos(cm.angle)*cm.len,cm.y-Math.sin(cm.angle)*cm.len);
        cg.addColorStop(0,`hsla(${cm.h},75%,80%,${cm.alpha.toFixed(2)})`);
        cg.addColorStop(0.4,`hsla(${cm.h},55%,62%,${(cm.alpha*0.25).toFixed(2)})`);
        cg.addColorStop(1,"rgba(3,1,12,0)");
        ctx.beginPath(); ctx.moveTo(cm.x,cm.y);
        ctx.lineTo(cm.x-Math.cos(cm.angle)*cm.len,cm.y-Math.sin(cm.angle)*cm.len);
        ctx.strokeStyle=cg; ctx.lineWidth=1.2; ctx.stroke();
      }
      raf = requestAnimationFrame(draw);
    }
    resize(); draw();
    cometTimer = setInterval(()=>{ if(Math.random()<0.55) spawnComet(); },3000);
    window.addEventListener("resize",resize);
    return ()=>{ cancelAnimationFrame(raf); clearInterval(cometTimer); window.removeEventListener("resize",resize); };
  },[ref]);
}

/* ── SOUL SPHERE CANVAS ── */
function useSoulCanvas(ref, alphaRef, modeRef, sTRef) {
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    const RINGS=10, PPR=18;
    let pts=[], raf, modeT=0;
    function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; }
    function build() {
      pts=[];
      for (let r=0;r<=RINGS;r++) {
        const phi=(r/RINGS)*Math.PI;
        for (let p=0;p<PPR;p++) pts.push({ phi, theta:(p/PPR)*Math.PI*2,
          bp:Math.random()*Math.PI*2, bs:0.015+Math.random()*0.03, sz:0.6+Math.random()*1.3 });
      }
    }
    function rot(phi,theta,ry,rx,R) {
      let x=R*Math.sin(phi)*Math.cos(theta), y=R*Math.cos(phi), z=R*Math.sin(phi)*Math.sin(theta);
      const x1=x*Math.cos(ry)+z*Math.sin(ry), z1=-x*Math.sin(ry)+z*Math.cos(ry); x=x1; z=z1;
      const y2=y*Math.cos(rx)-z*Math.sin(rx), z2=y*Math.sin(rx)+z*Math.cos(rx);
      return {x, y:y2, z:z2};
    }
    function draw() {
      const W=c.width, H=c.height;
      ctx.clearRect(0,0,W,H); raf=requestAnimationFrame(draw);
      const alpha=alphaRef.current; if (alpha<=0.01) return;
      sTRef.current+=0.0035; modeT+=0.004;
      const sT=sTRef.current, mode=modeRef.current;
      const cx=W/2, cy=H/2, base=Math.min(W,H)*0.13;
      let R, ry, rx, h1, rings, ppr, la, dm, hs, ha, ca;
      if (mode==="galaxy") {
        R=base*(1.5+Math.sin(modeT*1.8)*0.1); ry=sT*1.8; rx=Math.sin(sT*0.7)*0.4;
        h1=(modeT*60)%360; la=0.14; dm=1.6; hs=3.2; ha=0.09; ca=0.18; rings=14; ppr=24;
      } else if (mode==="star") {
        R=base*(1.25+Math.sin(modeT*1.2)*0.07); ry=sT*1.3; rx=Math.sin(sT*0.45)*0.3;
        h1=275+Math.sin(modeT*0.7)*35; la=0.10; dm=1.3; hs=2.5; ha=0.07; ca=0.12; rings=11; ppr=20;
      } else if (mode==="rose") {
        R=base*(1.1+Math.sin(modeT*0.85)*0.05); ry=sT*0.85; rx=Math.sin(sT*0.3)*0.22;
        h1=15+Math.sin(modeT*0.35)*18; la=0.08; dm=1.1; hs=2.0; ha=0.055; ca=0.09; rings=10; ppr=18;
      } else {
        R=base*(1+Math.sin(sT*0.85)*0.025); ry=sT*0.5; rx=Math.sin(sT*0.26)*0.2;
        h1=(sT*12)%360; la=0.05; dm=1.0; hs=2.4; ha=0.045; ca=0.08; rings=RINGS; ppr=PPR;
      }
      ctx.save(); ctx.globalAlpha=alpha;
      // outer halo
      const og=ctx.createRadialGradient(cx,cy,R*0.5,cx,cy,R*hs);
      og.addColorStop(0,`hsla(${h1},60%,68%,${ha})`);
      og.addColorStop(0.6,`hsla(${(h1+60)%360},50%,52%,${ha*0.4})`);
      og.addColorStop(1,"rgba(3,1,12,0)");
      ctx.beginPath(); ctx.arc(cx,cy,R*hs,0,Math.PI*2); ctx.fillStyle=og; ctx.fill();
      // core glow
      const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.1);
      ig.addColorStop(0,`hsla(${(h1+35)%360},72%,88%,${ca})`);
      ig.addColorStop(0.6,`hsla(${(h1+90)%360},60%,62%,${ca*0.45})`);
      ig.addColorStop(1,"rgba(3,1,12,0)");
      ctx.beginPath(); ctx.arc(cx,cy,R*1.1,0,Math.PI*2); ctx.fillStyle=ig; ctx.fill();
      // latitude rings
      for (let r=1;r<rings;r++) {
        const phi=(r/rings)*Math.PI;
        const rh=mode==="galaxy"?(h1+r*22)%360:mode==="star"?(268+r*14)%360:(258+r*11)%360;
        ctx.beginPath(); let first=true; let d=0;
        for (let s=0;s<=60;s++) {
          const theta=(s/60)*Math.PI*2, pt=rot(phi,theta,ry,rx,R);
          d=(pt.z+R)/(2*R);
          if(first){ctx.moveTo(cx+pt.x,cy-pt.y);first=false;} else ctx.lineTo(cx+pt.x,cy-pt.y);
        }
        ctx.strokeStyle=`hsla(${rh},52%,78%,${la+d*0.1})`; ctx.lineWidth=0.45; ctx.stroke();
      }
      // longitude lines
      for (let p2=0;p2<ppr;p2+=2) {
        const theta2=(p2/ppr)*Math.PI*2;
        ctx.beginPath(); let f2=true;
        for (let s2=0;s2<=40;s2++) {
          const phi2=(s2/40)*Math.PI, pt2=rot(phi2,theta2,ry,rx,R);
          if(f2){ctx.moveTo(cx+pt2.x,cy-pt2.y);f2=false;} else ctx.lineTo(cx+pt2.x,cy-pt2.y);
        }
        ctx.strokeStyle=`hsla(${(h1+125)%360},48%,70%,${la*0.7})`; ctx.lineWidth=0.35; ctx.stroke();
      }
      // blinking dots
      pts.forEach(sp => {
        sp.bp += sp.bs*(mode==="galaxy"?2.0:mode==="star"?1.5:1.0);
        const p3=rot(sp.phi,sp.theta,ry,rx,R);
        const d2=(p3.z+R)/(2*R);
        const blink=0.2+0.8*((Math.sin(sp.bp)+1)/2);
        const al=d2*blink*0.8; if(al<0.02) return;
        const dx=cx+p3.x, dy=cy-p3.y;
        const dh=mode==="galaxy"?(h1+sp.phi*55+sp.theta*12)%360:(255+sp.phi*42+sp.theta*7)%360;
        const sz=sp.sz*dm;
        const dg=ctx.createRadialGradient(dx,dy,0,dx,dy,sz*4);
        dg.addColorStop(0,`hsla(${dh},65%,82%,${al*0.4})`);
        dg.addColorStop(1,"rgba(3,1,12,0)");
        ctx.beginPath(); ctx.arc(dx,dy,sz*4,0,Math.PI*2); ctx.fillStyle=dg; ctx.fill();
        ctx.beginPath(); ctx.arc(dx,dy,sz*Math.max(0.25,d2),0,Math.PI*2);
        ctx.fillStyle=`hsla(${dh},70%,88%,${al})`; ctx.fill();
      });
      ctx.restore();
    }
    resize(); build(); draw();
    window.addEventListener("resize",resize);
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener("resize",resize); };
  },[ref,alphaRef,modeRef,sTRef]);
}

/* ── FX CANVAS — subtle rings + soft particles only ── */
function useFxCanvas(ref, fxRef) {
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    let raf;
    function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; }
    function draw() {
      ctx.clearRect(0,0,c.width,c.height); raf=requestAnimationFrame(draw);
      const fx=fxRef.current; if (!fx.active) return;
      // rings
      for (let i=fx.rings.length-1;i>=0;i--) {
        const r=fx.rings[i]; r.r+=r.spd; r.alpha-=r.fade;
        if(r.alpha<=0||r.r>r.max){fx.rings.splice(i,1);continue;}
        ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
        ctx.strokeStyle=`hsla(${r.h},${r.s}%,${r.l}%,${r.alpha})`;
        ctx.lineWidth=r.w; ctx.stroke();
      }
      // soft particles
      for (let i=fx.pts.length-1;i>=0;i--) {
        const p=fx.pts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.018; p.alpha-=p.fade;
        if(p.alpha<=0){fx.pts.splice(i,1);continue;}
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`hsla(${p.h},${p.s}%,${p.l}%,${p.alpha})`; ctx.fill();
      }
      if (!fx.rings.length && !fx.pts.length) fx.active=false;
    }
    resize(); draw();
    window.addEventListener("resize",resize);
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener("resize",resize); };
  },[ref,fxRef]);
}

/* ── SUBTLE EFFECT TRIGGERS — 3 tiers, no explosions ── */
function triggerEffect(fx, tier) {
  fx.rings=[]; fx.pts=[]; fx.active=true;
  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  const W=window.innerWidth, H=window.innerHeight;
  const R=Math.min(W,H);

  function ring(x,y,sr,mr,a,h,s,l,w,spd,fade){ fx.rings.push({x,y,r:sr,max:mr,alpha:a,h,s,l,w,spd,fade}); }
  function pt(x,y,vx,vy,a,r,h,s,l,fade){ fx.pts.push({x,y,vx,vy,alpha:a,r,h,s,l,fade}); }

  if (tier==="rose") {
    // 3 gentle expanding rings, soft rose
    ring(cx,cy,0,R*0.38,0.35,340,55,72,1.5,2.5,0.004);
    ring(cx,cy,0,R*0.28,0.22,350,50,68,3,1.8,0.003);
    setTimeout(()=>ring(cx,cy,0,R*0.45,0.18,330,52,70,1,2.0,0.003),400);
    // gentle scatter
    for(let i=0;i<30;i++){
      const a=Math.random()*Math.PI*2, spd=0.8+Math.random()*2;
      pt(cx,cy,Math.cos(a)*spd,Math.sin(a)*spd,0.5,0.8+Math.random()*1.5,338+Math.random()*15,58,74,0.006);
    }
  } else if (tier==="star") {
    // radial lines as rings + violet scatter
    ring(cx,cy,0,R*0.5,0.38,275,58,72,2,3.5,0.004);
    ring(cx,cy,0,R*0.35,0.28,265,52,68,4.5,2.5,0.003);
    ring(cx,cy,0,R*0.6,0.15,285,50,65,1.5,4,0.003);
    setTimeout(()=>ring(cx,cy,0,R*0.7,0.12,270,48,62,1,3,0.0025),350);
    for(let i=0;i<45;i++){
      const a=Math.random()*Math.PI*2, spd=1+Math.random()*3.5;
      pt(cx,cy,Math.cos(a)*spd,Math.sin(a)*spd,0.55,0.7+Math.random()*2,268+Math.random()*25,60,76,0.006);
    }
    // ring from edges inward
    for(let i=0;i<3;i++) setTimeout(()=>ring(cx,cy,R*0.8,R*0.82,0.1+(i*0.04),272+i*12,55,68,2,-(i+1)*2,0.003),i*200);
  } else {
    // galaxy — slow golden bloom
    ring(cx,cy,0,R*0.6,0.4,42,62,72,2.5,4,0.0035);
    ring(cx,cy,0,R*0.45,0.3,38,58,68,5,3,0.003);
    ring(cx,cy,0,R*0.75,0.2,48,55,65,1.5,4.5,0.003);
    setTimeout(()=>{
      ring(cx,cy,0,R*0.85,0.18,44,52,62,1.5,5,0.0025);
      ring(cx,cy,0,R*0.5,0.25,50,60,70,4,3.5,0.003);
    },300);
    setTimeout(()=>ring(cx,cy,0,R*1.0,0.12,40,50,60,2,6,0.0022),600);
    for(let i=0;i<60;i++){
      const a=Math.random()*Math.PI*2, spd=0.6+Math.random()*4;
      pt(cx,cy,Math.cos(a)*spd,Math.sin(a)*spd,0.6,0.6+Math.random()*2.2,38+Math.random()*18,62,76,0.005);
    }
    // soft bloom rings around center offset
    for(let i=0;i<4;i++){
      const oa=(i/4)*Math.PI*2, od=R*0.12;
      setTimeout(()=>ring(cx+Math.cos(oa)*od,cy+Math.sin(oa)*od,0,R*0.22,0.18,44+i*8,55,68,2,2.5,0.004),i*150);
    }
  }
}

  const fadeSoul=useCallback((to,dur=700)=>new Promise(res=>{
    const from=alphaRef.current, t0=performance.now();
    function step(now){ const t=Math.min((now-t0)/dur,1); alphaRef.current=from+(to-from)*t; if(t<1)requestAnimationFrame(step); else{alphaRef.current=to;res();} }
    requestAnimationFrame(step);
  }),[]);

  // Fixed typewrite — captures char by index into a ref-based string, sets once at end OR drip-feeds safely
  const typewrite=useCallback((setter,text,speed)=>new Promise(res=>{
    if(!text||typeof text!=="string"){setter("");res();return;}
    const chars=text.split("");
    let i=0, built="";
    setter("");
    const iv=setInterval(()=>{
      if(i<chars.length){ built+=chars[i]; i++; setter(built); }
      else{ clearInterval(iv); res(); }
    },speed);
  }),[]);

  const updateQ=useCallback(()=>{
    setQueueItems([...priQ.current,...freeQ.current].slice(0,8));
  },[]);

  const stopNudge=useCallback(()=>{
    if(nudgeTimer.current){clearInterval(nudgeTimer.current);nudgeTimer.current=null;}
    setNudgeOn(false);
  },[]);

  const startNudge=useCallback(()=>{
    stopNudge();
    let idx=0;
    const show=()=>{
      setNudgeOn(false);
      setTimeout(()=>{ idx=(idx+1)%NUDGE_MSGS.length; setNudgeText(NUDGE_MSGS[idx]); setNudgeOn(true); setTimeout(()=>setNudgeOn(false),4200); },1000);
    };
    setTimeout(()=>{ setNudgeText(NUDGE_MSGS[0]); setNudgeOn(true); setTimeout(()=>setNudgeOn(false),4200); nudgeTimer.current=setInterval(show,10000); },6000);
  },[stopNudge]);

  const display=useCallback((item)=>{
    const tier=item.gifted?item.level:"none";
    const soulTarget={rose:"rose",star:"star",galaxy:"galaxy",none:"idle"}[tier]||"idle";
    const holdTime=tier==="galaxy"?6500:tier==="star"?5200:tier==="rose"?4600:3600;

    return fadeSoul(0,600)
      .then(()=>{ setIdle(false); modeRef.current=soulTarget; return wait(300); })
      .then(()=>{
        if(item.gifted){ triggerEffect(fxState.current,tier); }
        setToastVisible(true); return wait(700);
      })
      .then(()=>{ setToastVisible(false); return wait(200); })
      .then(()=>{
        setGiftBadge(item.gifted?(tier==="galaxy"?"galaxy moment":tier==="star"?"star featured":"featured"):null);
        setMsgVisible(true); setDivVisible(false); setReplyText(""); setThinking(false);
        return typewrite(setUnsentText,item.text,40);
      })
      .then(()=>wait(550))
      .then(()=>{ setDivVisible(true); return wait(700); })
      .then(()=>{
        setThinking(true); setAiStatus("thinking");
        const fallback=getFallbackReply(recentRef.current);
        return generateReply(item.text)
          .then(r=>{ recentRef.current=[...recentRef.current.slice(-5),r]; return r; })
          .catch(()=>fallback);
      })
      .then(reply=>{
        setAiStatus("ready"); setThinking(false);
        if(!reply||typeof reply!=="string") reply=getFallbackReply(recentRef.current);
        return typewrite(setReplyText,reply,50);
      })
      .then(()=>wait(holdTime))
      .then(()=>{ setMsgFading(true); setGiftBadge(null); return wait(1000); })
      .then(()=>{
        setMsgVisible(false); setMsgFading(false);
        setUnsentText(""); setReplyText(""); setDivVisible(false);
        modeRef.current="idle"; setIdle(true);
        return fadeSoul(1,900);
      });
  },[fadeSoul,typewrite]);

  const next=useCallback(()=>{
    const item=priQ.current.length>0?priQ.current.shift():freeQ.current.shift();
    if(!item){playing.current=false;updateQ();startNudge();return;}
    playing.current=true; stopNudge(); updateQ();
    display(item).then(next);
  },[display,updateQ,startNudge,stopNudge]);

  const enqueue=useCallback((text,gifted,level)=>{
    if(!text||typeof text!=="string") return;
    const item={text:text.trim(),gifted:gifted||false,level:level||"none"};
    if(gifted) priQ.current.push(item); else freeQ.current.push(item);
    updateQ(); if(!playing.current) next();
  },[updateQ,next]);

  const addChat=useCallback((user,text,gifted,level)=>{
    setChatLog(p=>[...p,{user,text,gifted,level}].slice(-20));
  },[]);

  const simChat=useCallback(()=>{
    let idx=simIdx.current;
    if(idx>=CHAT_SIMS.length){simIdx.current=0;idx=0;}
    const batch=CHAT_SIMS.slice(idx,idx+3); simIdx.current+=3;
    batch.forEach((m,i)=>setTimeout(()=>{ addChat(m.user,m.text,m.gifted,m.level||"none"); enqueue(m.text,m.gifted,m.level||"none"); },i*1000));
  },[addChat,enqueue]);

  const runDemo=useCallback((i)=>{
    if(playing.current) return;
    freeQ.current=[]; priQ.current=[];
    const m=DEMO_MSGS[i]; if(m) enqueue(m.text,m.gifted,m.level);
  },[enqueue]);

  const reset=useCallback(()=>{
    playing.current=false; freeQ.current=[]; priQ.current=[];
    alphaRef.current=1; modeRef.current="idle";
    fxState.current={active:false,rings:[],pts:[]};
    setIdle(true); setMsgVisible(false); setMsgFading(false);
    setUnsentText(""); setReplyText(""); setDivVisible(false);
    setGiftBadge(null); setToastVisible(false); setThinking(false);
    setAiStatus("ready"); updateQ(); startNudge();
  },[updateQ,startNudge]);

  useEffect(()=>{ startNudge(); return stopNudge; },[startNudge,stopNudge]);

  // Bridge WebSocket connection
  useEffect(()=>{
    if(!BRIDGE_URL) return;
    let ws, reconnTimer;
    function connect(){
      setBridgeStatus("connecting");
      ws=new WebSocket(BRIDGE_URL);
      wsRef.current=ws;
      ws.onopen=()=>{ setBridgeStatus("live"); console.log("[Bridge] Connected"); };
      ws.onclose=()=>{
        setBridgeStatus("disconnected");
        reconnTimer=setTimeout(connect,5000);
      };
      ws.onerror=()=>setBridgeStatus("disconnected");
      ws.onmessage=(e)=>{
        let d; try{ d=JSON.parse(e.data); }catch{ return; }

        if(d.type==="message"){
          // Check if there's a pending gift from this user (within 30s)
          const pg=pendingGifts.current[d.user];
          const gifted=pg&&(Date.now()-pg.ts)<30000;
          const level=gifted?pg.tier:"none";
          if(gifted) delete pendingGifts.current[d.user];
          addChat(d.displayName||d.user, d.text, gifted, level);
          enqueue(d.text, gifted, level);
        }
        else if(d.type==="gift"){
          // Store gift keyed by user, waiting for their next ♥ message
          pendingGifts.current[d.user]={ tier:d.tier, ts:Date.now() };
          addChat(d.displayName||d.user, "sent a gift: "+d.giftName+" ("+d.tier+")", true, d.tier);
        }
        else if(d.type==="viewers"){ setViewers(d.count); }
        else if(d.type==="tiktok_connected"){ setBridgeStatus("live"); }
        else if(d.type==="stream_end"){ setBridgeStatus("disconnected"); }
      };
    }
    connect();
    return ()=>{ if(ws) ws.close(); clearTimeout(reconnTimer); };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[BRIDGE_URL]);

  const divColor=giftBadge
    ? giftBadge.includes("galaxy")?"rgba(220,185,100,0.65)":giftBadge.includes("star")?"rgba(148,92,210,0.7)":"rgba(218,108,130,0.65)"
    : "rgba(218,108,130,0.45)";

  return (
    <div style={{width:"100vw",height:"100vh",background:"#03010c",overflow:"hidden",fontFamily:"'Outfit',sans-serif",color:"#f6eeff",position:"relative"}}>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;700&display=swap" rel="stylesheet"/>
      {/* Bridge status pill — top left, only shows when bridge URL is set */}
      {BRIDGE_URL && (
        <div style={{position:"fixed",top:18,left:18,zIndex:50,display:"flex",alignItems:"center",gap:7,padding:"6px 12px",background:"rgba(3,1,12,0.7)",border:"1px solid rgba(246,238,255,0.07)",borderRadius:20,fontSize:9,letterSpacing:"0.18em",textTransform:"uppercase",color:"rgba(246,238,255,0.3)",backdropFilter:"blur(8px)"}}>
          <div style={{width:5,height:5,borderRadius:"50%",background:bridgeStatus==="live"?"rgba(100,220,160,0.9)":bridgeStatus==="connecting"?"rgba(220,185,100,0.9)":"rgba(220,100,100,0.7)",boxShadow:bridgeStatus==="live"?"0 0 5px rgba(100,220,160,0.5)":"none",transition:"background 0.4s"}}/>
          {bridgeStatus==="live"?"live"+(viewers!==null?" · "+viewers+" viewers":""):bridgeStatus==="connecting"?"connecting...":"bridge offline"}
        </div>
      )}
      <style>{`
        @keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.26)}30%{transform:scale(1)}45%{transform:scale(1.12)}60%{transform:scale(1)}}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        @keyframes tp{0%,100%{opacity:.25}50%{opacity:.9}}
        @keyframes fadeIn{from{opacity:0;transform:translate(-50%,calc(-50% + 12px))}to{opacity:1;transform:translate(-50%,-50%)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .cursor{display:inline-block;width:2px;height:.88em;background:#f6eeff;vertical-align:middle;margin-left:2px;animation:blink 1s step-end infinite;}
        .td1{animation:tp 1.2s ease-in-out infinite}
        .td2{animation:tp 1.2s ease-in-out .2s infinite}
        .td3{animation:tp 1.2s ease-in-out .4s infinite}
        ::-webkit-scrollbar{width:2px}
        ::-webkit-scrollbar-thumb{background:rgba(246,238,255,.08)}
        button{transition:all .2s ease}
      `}</style>

      <canvas ref={bgRef} style={{position:"fixed",inset:0,zIndex:0}}/>
      <canvas ref={soulRef} style={{position:"fixed",inset:0,zIndex:2,pointerEvents:"none"}}/>
      <canvas ref={fxRef} style={{position:"fixed",inset:0,zIndex:4,pointerEvents:"none"}}/>
      <div style={{position:"fixed",inset:0,zIndex:3,pointerEvents:"none",background:"radial-gradient(ellipse at center,transparent 20%,rgba(3,1,12,.45) 60%,rgba(3,1,12,.97) 100%)"}}/>

      {/* IDLE */}
      {idle && (
        <div style={{position:"fixed",inset:0,zIndex:5,pointerEvents:"none"}}>
          <div style={{position:"absolute",top:"28%",left:"50%",width:"88%",textAlign:"center",fontSize:"clamp(20px,3.2vw,40px)",fontWeight:300,letterSpacing:"0.03em",lineHeight:1.48,color:"rgba(246,238,255,.88)",animation:"fadeIn 1.8s ease .8s both"}}>
            If you had{" "}
            <span style={{fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em"}}>one</span>
            {" "}last message…<br/>what would you say?
            <span style={{display:"inline-block",color:"rgb(218,108,130)",marginLeft:5,verticalAlign:"middle",filter:"drop-shadow(0 0 7px rgba(218,108,130,.75))",animation:"hb 2s ease-in-out infinite"}}>♥</span>
          </div>
          <div style={{position:"absolute",bottom:52,left:"50%",transform:"translateX(-50%)",fontSize:14,fontWeight:300,letterSpacing:"0.2em",textTransform:"uppercase",color:"rgba(246,238,255,.18)",whiteSpace:"nowrap",animation:"fadeUp 1.5s ease 2.2s both"}}>
            type <span style={{color:"rgba(218,108,130,.55)"}}>♥</span> followed by your message in chat
          </div>
          <div style={{position:"absolute",bottom:86,left:"50%",transform:"translateX(-50%)",fontSize:13,letterSpacing:"0.2em",textTransform:"uppercase",whiteSpace:"nowrap",transition:"opacity 1.2s ease",opacity:nudgeOn?0.42:0,color:"rgba(220,185,100,1)"}}>
            ✦ {nudgeText}
          </div>
        </div>
      )}

      {/* STAGE */}
      <div style={{position:"fixed",inset:0,zIndex:6,display:"flex",alignItems:"center",justifyContent:"center",padding:"80px 60px"}}>
        <div style={{width:"100%",maxWidth:620,textAlign:"center",opacity:msgVisible?(msgFading?0:1):0,transition:"opacity 1s ease"}}>
          {giftBadge && (
            <div style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:10,fontWeight:300,letterSpacing:"0.24em",textTransform:"uppercase",color:"rgba(220,185,100,.72)",marginBottom:16,animation:"fadeUp .5s ease both"}}>
              <div style={{width:4,height:4,borderRadius:"50%",background:"rgb(220,185,100)",boxShadow:"0 0 5px rgb(220,185,100)"}}/>
              {giftBadge}
            </div>
          )}
          <div style={{fontSize:"clamp(18px,2.7vw,29px)",fontWeight:200,lineHeight:1.68,letterSpacing:"0.01em",color:"#f6eeff",minHeight:"2em"}}>
            {unsentText}
            {msgVisible&&!replyText&&!thinking&&<span className="cursor"/>}
          </div>
          <div style={{width:26,height:1,background:`linear-gradient(to right,transparent,${divColor},transparent)`,margin:"24px auto",opacity:divVisible?1:0,transform:divVisible?"scaleX(1)":"scaleX(0)",transition:"opacity .6s ease,transform .6s ease"}}/>
          {thinking && (
            <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:6}}>
              {["td1","td2","td3"].map(c=><div key={c} className={c} style={{width:3,height:3,borderRadius:"50%",background:"rgba(188,162,255,.5)"}}/>)}
            </div>
          )}
          <div style={{fontSize:"clamp(13px,1.55vw,15px)",fontWeight:300,lineHeight:1.82,letterSpacing:"0.04em",color:"rgba(188,162,255,.88)",minHeight:"1.8em"}}>
            {replyText}
          </div>
        </div>
      </div>

      {/* TOAST */}
      <div style={{position:"fixed",bottom:38,left:"50%",transform:`translateX(-50%) translateY(${toastVisible?0:8}px)`,zIndex:20,fontSize:10,fontWeight:300,letterSpacing:"0.3em",textTransform:"uppercase",color:"rgba(246,238,255,.22)",opacity:toastVisible?1:0,transition:"opacity .4s,transform .4s"}}>
        receiving
      </div>

      {/* PANEL TOGGLE */}
      <button onClick={()=>setPanelOpen(o=>!o)} style={{position:"fixed",top:18,right:18,zIndex:50,background:"rgba(246,238,255,.04)",border:"1px solid rgba(246,238,255,.09)",color:"rgba(246,238,255,.35)",fontFamily:"'Outfit',sans-serif",fontSize:9,letterSpacing:"0.18em",textTransform:"uppercase",padding:"8px 13px",cursor:"pointer"}}>
        ♥ live panel
      </button>

      {/* SIDE PANEL */}
      <div style={{position:"fixed",top:0,right:0,width:280,height:"100%",zIndex:40,background:"rgba(3,1,12,.95)",borderLeft:"1px solid rgba(246,238,255,.05)",display:"flex",flexDirection:"column",transform:panelOpen?"translateX(0)":"translateX(100%)",transition:"transform .4s ease"}}>
        <div style={{padding:"14px 16px",borderBottom:"1px solid rgba(246,238,255,.05)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:10,fontWeight:400,letterSpacing:"0.26em",textTransform:"uppercase",color:"rgba(246,238,255,.35)"}}>UnsentWords Live</span>
          <button onClick={()=>setPanelOpen(false)} style={{background:"none",border:"none",color:"rgba(246,238,255,.25)",fontSize:14,cursor:"pointer",padding:"2px 4px"}}>x</button>
        </div>
        <div style={{display:"flex",borderBottom:"1px solid rgba(246,238,255,.05)"}}>
          {["chat","queue"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:9,fontSize:9,letterSpacing:"0.2em",textTransform:"uppercase",fontFamily:"'Outfit',sans-serif",background:"none",border:"none",borderBottom:tab===t?"2px solid rgb(218,108,130)":"2px solid transparent",color:tab===t?"#f6eeff":"rgba(246,238,255,.22)",cursor:"pointer"}}>{t}</button>
          ))}
        </div>
        <div style={{flex:1,overflowY:"auto",padding:12}}>
          {tab==="chat" && (
            <div>
              <div style={{padding:"7px 10px",marginBottom:8,background:"rgba(188,162,255,.05)",border:"1px solid rgba(188,162,255,.1)",fontSize:10,letterSpacing:"0.14em",color:"rgba(188,162,255,.55)",display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:5,height:5,borderRadius:"50%",background:aiStatus==="thinking"?"rgba(220,185,100,.85)":"rgba(100,220,160,.85)",transition:"background .3s"}}/>
                {aiStatus==="thinking"?"generating reply…":"AI engine ready"}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {chatLog.map((m,i)=>(
                  <div key={i} style={{padding:"7px 10px",background:m.gifted?"rgba(220,185,100,.04)":"rgba(246,238,255,.025)",borderLeft:`2px solid ${m.gifted?"rgb(220,185,100)":"rgba(218,108,130,.6)"}`,fontSize:11,lineHeight:1.5}}>
                    <div style={{fontSize:9,letterSpacing:"0.13em",color:"rgba(246,238,255,.28)",marginBottom:3,textTransform:"uppercase"}}>@{m.user}</div>
                    <div style={{color:"rgba(246,238,255,.6)",fontWeight:200}}>{m.text}</div>
                    {m.gifted&&<div style={{fontSize:9,color:"rgba(220,185,100,.6)",marginTop:3}}>✦ gift · {m.level}</div>}
                  </div>
                ))}
              </div>
              <button onClick={simChat} style={{width:"100%",padding:8,marginTop:10,background:"rgba(148,92,210,.07)",border:"1px solid rgba(148,92,210,.18)",color:"rgba(148,92,210,.65)",fontFamily:"'Outfit',sans-serif",fontSize:9,letterSpacing:"0.18em",textTransform:"uppercase",cursor:"pointer",borderRadius:2}}>Simulate live chat</button>
            </div>
          )}
          {tab==="queue" && (
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {queueItems.length===0
                ? <div style={{fontSize:11,color:"rgba(246,238,255,.18)",textAlign:"center",padding:"28px 0",letterSpacing:"0.1em"}}>queue is empty</div>
                : queueItems.map((item,i)=>(
                  <div key={i} style={{padding:"8px 11px",background:item.gifted?"rgba(220,185,100,.035)":"rgba(246,238,255,.025)",borderLeft:`2px solid ${item.gifted?"rgb(220,185,100)":"rgba(246,238,255,.08)"}`,fontSize:11}}>
                    <div style={{fontSize:9,letterSpacing:"0.16em",color:"rgba(246,238,255,.22)",marginBottom:3}}>{item.gifted?"✦ priority · ":""}{`#${i+1}`}</div>
                    <div style={{color:"rgba(246,238,255,.55)",fontWeight:200,lineHeight:1.45}}>{item.text.substring(0,80)}{item.text.length>80?"…":""}</div>
                  </div>
                ))
              }
            </div>
          )}
        </div>
      </div>

      {/* DEMO CONTROLS */}
      <div style={{position:"fixed",bottom:18,right:18,zIndex:30,display:"flex",flexDirection:"column",gap:5,alignItems:"flex-end"}}>
        <div style={{fontSize:8,letterSpacing:"0.2em",textTransform:"uppercase",color:"rgba(246,238,255,.1)",marginBottom:2}}>demo</div>
        {["Free msg","Rose gift","Star gift","Galaxy gift"].map((lbl,i)=>(
          <button key={lbl} onClick={()=>runDemo(i)} style={{background:"rgba(246,238,255,.03)",border:"1px solid rgba(246,238,255,.07)",color:"rgba(246,238,255,.25)",fontFamily:"'Outfit',sans-serif",fontSize:9,letterSpacing:"0.13em",textTransform:"uppercase",padding:"6px 12px",cursor:"pointer"}}>{lbl}</button>
        ))}
        <button onClick={reset} style={{background:"rgba(246,238,255,.03)",border:"1px solid rgba(246,238,255,.07)",color:"rgba(246,238,255,.25)",fontFamily:"'Outfit',sans-serif",fontSize:9,letterSpacing:"0.13em",textTransform:"uppercase",padding:"6px 12px",cursor:"pointer"}}>Reset</button>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App, null));
</script>
</body>
</html>
